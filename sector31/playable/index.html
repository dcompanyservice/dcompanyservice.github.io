//  최단 8수(←↑←↓←↑←←). 곧장 출구로(←↑←←) 가면 66 이 출구 앞(1,2)에 들어가 영원히 막힌다.
var WALL = ['######', '#....#', 'E....#', '#....P', '#....#', '######'];
var COLS = 6, ROWS = 6, EXIT = { x: 0, y: 2 }, START = { x: 5, y: 3 };
var ROCKS0 = [{ x: 1, y: 1, id: 60 }, { x: 4, y: 1, id: 66 }, { x: 2, y: 2, id: 66 }, { x: 2, y: 3, id: 62 },
              { x: 4, y: 3, id: 62 }, { x: 1, y: 4, id: 68 }, { x: 2, y: 4, id: 61 }].map(function (r, i) { r.n = i; r.img = 'rock_' + r.id; return r; });
var PERFECT_PUSH = 4;   // sector23.json meta.target.push — 별점 만점(최단 8수 중 밀기 4번)
var DMG = 110;          // 기본 STR 100 → 10+STR
var HP = { 60: 80, 61: 60, 62: 50, 66: 10, 68: 5 };   // StoneData.gd
var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
var FACE_ROW = { down: 0, up: 1, left: 2, right: 3 };   // player.webp 행: front·back·left·right

function isWall(x, y) { return x < 0 || y < 0 || x >= COLS || y >= ROWS || WALL[y][x] === '#'; }
function isExit(x, y) { return x === EXIT.x && y === EXIT.y; }

// ── 상태 ───────────────────────────────────────────────────────
var S;
function reset() {
  S = { px: START.x, py: START.y, face: 'left', rocks: ROCKS0.map(function (r) { return Object.assign({}, r); }),
        moves: 0, pushes: 0, anim: null, fx: [], shake: 0, done: false };
}
function rockAt(st, x, y) { for (var i = 0; i < st.rocks.length; i++) if (st.rocks[i].x === x && st.rocks[i].y === y) return st.rocks[i]; return null; }

// 규칙 한 걸음 — 결과 종류를 돌려준다(그리기는 따로). 순수 함수처럼 st 만 바꾼다.
function stepMove(st, dir) {
  var d = DIRS[dir], nx = st.px + d[0], ny = st.py + d[1];
  st.face = dir;
  if (isWall(nx, ny) && !isExit(nx, ny)) return { kind: 'bump' };
  var r = rockAt(st, nx, ny);
  if (r) {
    var bx = nx + d[0], by = ny + d[1];
    if (isWall(bx, by) || isExit(bx, by) || rockAt(st, bx, by)) return { kind: 'blocked', rock: r, exitBehind: isExit(bx, by) };
    r.x = bx; r.y = by;
    st.px = nx; st.py = ny; st.moves++; st.pushes++;
    return { kind: 'push', rock: r };
  }
  st.px = nx; st.py = ny; st.moves++;
  return { kind: 'move' };
}
// 출구까지 갈 수 있나 + 다음 한 수 (너비 우선 — 힌트·막힘 판정). 돌은 id 무관하게 위치만 본다.
function solve(st) {
  var key = function (s) { return s.px + ',' + s.py + '|' + s.rocks.map(function (r) { return r.x * 10 + r.y; }).sort().join(','); };
  var clone = function (s) { return { px: s.px, py: s.py, face: s.face, moves: 0, pushes: 0, rocks: s.rocks.map(function (r) { return { x: r.x, y: r.y }; }) }; };
  var q = [{ s: clone(st), first: null, n: 0 }], head = 0, seen = {};
  seen[key(st)] = 1;
  while (head < q.length) {
    var cur = q[head++];
    if (isExit(cur.s.px, cur.s.py)) return { moves: cur.n, first: cur.first };
    for (var dir in DIRS) {
      var ns = clone(cur.s), res = stepMove(ns, dir);
      if (res.kind === 'bump' || res.kind === 'blocked') continue;
      var k = key(ns);
      if (seen[k]) continue;
      seen[k] = 1;
      q.push({ s: ns, first: cur.first || { act: 'move', dir: dir }, n: cur.n + 1 });
    }
  }
  return null;
}

// ── 화면 크기 ──────────────────────────────────────────────────
var W = 0, H = 0, DPR = 1, T = 48, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  var top = Math.max(64, H * 0.11), bottom = Math.max(130, H * 0.2);
  T = Math.floor(Math.min(W / (COLS + 0.1), (H - top - bottom) / (ROWS + 0.1)));   // 6칸 전부(왼쪽 출구·오른쪽 입구가 벽 열에 있다)
  OX = Math.round((W - T * COLS) / 2);
  OY = Math.round(top + (H - top - bottom - T * ROWS) / 2);
}
window.addEventListener('resize', resize);

// ── 장면 진행 ──────────────────────────────────────────────────
// phase: demo → challenge → play → end
var phase = 'demo', banner = null, endCard = null, hint = null, lastInput = 0, t0 = 0, now = 0, tries = 0;
// 자동 실패 장면 2번(2026-10-17 사용자 "너무 빨리 지나감, 느리게 2번 정도 다른 형태로") — 한 걸음 0.6초
//   ① 곧장 출구로 → 66 을 출구 앞(1,2)에 밀어 넣음 = 막힘(해법 없음을 solve 로 확인)
//   ② 아래 길로 → 61 이 68 에 막혀 안 밀리자 노란 버튼으로 부숨 = 부수면 실패(MaxBreakStones 0)
var DEMOS = [{ seq: ['left', 'up', 'left', 'left'], end: 'stuck' },
             { seq: ['left', 'down', 'left', 'left', 'attack'], end: 'broke' }];
var DEMO_STEP_MS = 600;
var demoRun = 0, demoIdx = 0, demoNext = 0;

function showBanner(text, ms, color) { banner = { text: text, t: now, ms: ms, color: color || '#fff' }; }

function animate(kind, dir, extra) {
  var d = DIRS[dir];
  S.anim = { kind: kind, t: now, ms: 200, fx: S.px - (kind === 'walk' ? d[0] : 0), fy: S.py - (kind === 'walk' ? d[1] : 0), rock: extra };
}

function doMove(dir) {
  if (S.anim || S.done) return;
  var r = stepMove(S, dir);
  if (r.kind === 'move' || r.kind === 'push') {
    animate('walk', dir, r.kind === 'push' ? { r: r.rock, fx: r.rock.x - DIRS[dir][0], fy: r.rock.y - DIRS[dir][1] } : null);
  } else {
    S.shake = now;
    if (r.kind === 'blocked' && r.exitBehind) floatText(T_(r.rock.x, r.rock.y), TXT.blocked, '#ffd166');
  }
  after(r);
}
function doAttack() {
  if (S.anim || S.done) return;
  var dir = S.face, d = DIRS[dir], tx = S.px + d[0], ty = S.py + d[1];
  animate('attack', dir, null);
  S.attacks = (S.attacks || 0) + 1;
  var r = rockAt(S, tx, ty);
  if (!r) return;
  var c = T_(tx, ty);
  floatText(c, '-' + DMG, '#ff6b6b');
  S.shake = now;
  if (DMG >= (HP[r.id] || 1)) {
    S.rocks.splice(S.rocks.indexOf(r), 1);
    burst(c, 26, '#c9b48a');
    if (phase === 'play') {   // MaxBreakStones 0 — 하나라도 부수면 즉시 실패
      S.done = true;
      showBanner(TXT.brokeNow, 1300, '#ff6b6b');
      setTimeout(function () { endCard = { t: now, win: false, broke: true }; }, 1100);
    }
  }
}
function after(r) {
  if (phase !== 'play') return;
  setTimeout(check, 230);
}
function check() {
  if (S.done || phase !== 'play') return;
  if (isExit(S.px, S.py)) { S.done = true; win(); return; }
  var sol = solve(S);
  if (!sol) { S.done = true; lose(); }
}
function win() {
  burst(T_(S.px, S.py), 40, '#ffd166');
  showBanner(TXT.clear, 1400, '#ffd166');
  setTimeout(function () { endCard = { t: now, win: true }; }, 1100);
}
function lose() {
  showBanner(TXT.stuck, 1200, '#ff6b6b');
  setTimeout(function () { endCard = { t: now, win: false }; }, 1000);
}
function startPlay() {
  reset();
  phase = 'play'; tries++;
  endCard = null; lastInput = now;
}

// ── 입력: 스와이프 이동 · 인접 칸 탭(그쪽으로 한 칸 — 돌이면 민다) · 노란 버튼 공격 · 키보드 ──────
var down = null;
function btnRect() { var s = Math.max(78, Math.min(110, W * 0.22)); return { x: W - s - Math.max(16, W * 0.06), y: H - s - Math.max(18, H * 0.035), w: s, h: s }; }   // 오른쪽 아래(2026-10-17 사용자 "오른쪽이 좋겠네")
function getRect() { var w = 64, h = 30; return { x: W - w - 12, y: 14, w: w, h: h }; }
function inR(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function endButtons() {
  var bw = Math.min(W * 0.72, 320), bh = 58, x = (W - bw) / 2, y = H * 0.62;
  return { install: { x: x, y: y, w: bw, h: bh }, retry: { x: (W - bw * 0.6) / 2, y: y + bh + 18, w: bw * 0.6, h: 44 } };
}
cv.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: now }; });
cv.addEventListener('pointerup', function (e) {
  if (!down) return;
  var p = { x: e.clientX, y: e.clientY }, dx = p.x - down.x, dy = p.y - down.y;
  var start = down; down = null;
  lastInput = now; hint = null;
  if (inR(start, getRect())) { CTA(); return; }
  if (endCard) {
    var b = endButtons();
    if (inR(p, b.install)) { CTA(); return; }
    if (inR(p, b.retry) && now - endCard.t > 500) { startPlay(); return; }
    return;
  }
  if (phase === 'demo' || phase === 'challenge') { skipToPlay(); return; }
  if (phase !== 'play') return;
  if (Math.abs(dx) < 22 && Math.abs(dy) < 22) {
    if (inR(p, btnRect())) { doAttack(); return; }
    var gx = Math.floor((p.x - OX) / T), gy = Math.floor((p.y - OY) / T);
    var ddx = gx - S.px, ddy = gy - S.py;
    if (Math.abs(ddx) + Math.abs(ddy) === 1) {
      var dir = ddx === 1 ? 'right' : ddx === -1 ? 'left' : ddy === 1 ? 'down' : 'up';
      doMove(dir);
    }
    return;
  }
  doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
window.addEventListener('keydown', function (e) {
  var m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  lastInput = now; hint = null;
  if (phase !== 'play' || endCard) return;
  if (m) doMove(m); else if (e.key === ' ') doAttack();
});
function skipToPlay() { if (phase === 'play') return; banner = null; startPlay(); }

// ── 효과 ───────────────────────────────────────────────────────
function T_(x, y) { return { x: OX + (x + 0.5) * T, y: OY + (y + 0.5) * T }; }
function floatText(p, s, color) { S.fx.push({ k: 'txt', x: p.x, y: p.y, s: s, c: color, t: now }); }
function burst(p, n, color) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, v = T * (1.2 + Math.random() * 2.4);
    S.fx.push({ k: 'dot', x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - T, c: color, r: T * (0.04 + Math.random() * 0.06), t: now });
  }
}

// ── 그리기 ─────────────────────────────────────────────────────
function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function ease(k) { return k < 0 ? 0 : k > 1 ? 1 : 1 - Math.pow(1 - k, 3); }

function drawBoard() {
  var floor = IMG.floor;
  for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
    if (isWall(x, y) && !isExit(x, y)) continue;
    var px = OX + x * T, py = OY + y * T;
    if (floor && floor.width) cx.drawImage(floor, px, py, T + 0.5, T + 0.5); else { cx.fillStyle = '#d8ccb3'; cx.fillRect(px, py, T, T); }
  }
  // 벽 쪽 그림자(게임 벽 가장자리처럼 바닥이 어둠으로 녹아든다)
  for (y = 0; y < ROWS; y++) for (x = 0; x < COLS; x++) {
    if (isWall(x, y) && !isExit(x, y)) continue;
    px = OX + x * T; py = OY + y * T;
    var sides = [[0, -1, px, py, px, py + T * 0.32], [0, 1, px, py + T, px, py + T * 0.68], [-1, 0, px, py, px + T * 0.32, py], [1, 0, px + T, py, px + T * 0.68, py]];
    sides.forEach(function (s) {
      if (!isWall(x + s[0], y + s[1]) || isExit(x + s[0], y + s[1])) return;
      var g = cx.createLinearGradient(s[2], s[3], s[4], s[5]);
      g.addColorStop(0, 'rgba(5,5,12,0.95)'); g.addColorStop(1, 'rgba(5,5,12,0)');
      cx.fillStyle = g; cx.fillRect(px, py, T, T);
    });
  }
  // 출구
  var e = T_(EXIT.x, EXIT.y);
  if (IMG.door && IMG.door.width) cx.drawImage(IMG.door, e.x - T * 0.42, e.y - T * 0.42, T * 0.84, T * 0.84);
  var bob = Math.sin(now / 260) * T * 0.08;   // 출구 화살표(게임 exit_arrow_left) — 출구 칸 위에서 왼쪽으로 까딱
  if (IMG.arrow_left && IMG.arrow_left.width) { cx.globalAlpha = 0.9; cx.drawImage(IMG.arrow_left, e.x - T * 0.3 + bob, e.y - T * 0.3, T * 0.6, T * 0.6); cx.globalAlpha = 1; }
}

function drawRock(r, x, y) {
  var im = IMG[r.img], s = T * 1.08;
  if (im && im.width) cx.drawImage(im, x - s / 2, y - s / 2 - T * 0.04, s, s);
}

function playerScreen() {
  var a = S.anim, x = S.px, y = S.py;
  if (a && a.kind === 'walk') { var k = ease((now - a.t) / a.ms); x = a.fx + (S.px - a.fx) * k; y = a.fy + (S.py - a.fy) * k; }
  return T_(x, y);
}
function drawPlayer() {
  var im = IMG.player; if (!im || !im.width) return;
  var a = S.anim, set = 0, fps = 9, frame;
  if (a && a.kind === 'walk') { set = 1; frame = Math.floor((now - a.t) / a.ms * 8) % 8; }
  else if (a && a.kind === 'attack') { set = 2; frame = Math.min(7, Math.floor((now - a.t) / a.ms * 8)); }
  else frame = Math.floor(now / (1000 / fps)) % 8;
  var row = set * 4 + FACE_ROW[S.face], p = playerScreen(), s = T * 1.75;
  cx.fillStyle = 'rgba(0,0,0,0.28)'; cx.beginPath(); cx.ellipse(p.x, p.y + T * 0.36, T * 0.3, T * 0.1, 0, 0, Math.PI * 2); cx.fill();
  cx.drawImage(im, frame * 128, row * 128, 128, 128, p.x - s / 2, p.y + T * 0.48 - s * 0.93, s, s);
}

function drawLight() {
  var p = playerScreen();
  var g = cx.createRadialGradient(p.x, p.y, T * 3.2, p.x, p.y, T * 6.5);
  g.addColorStop(0, 'rgba(2,2,5,0)'); g.addColorStop(1, 'rgba(2,2,5,0.78)');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
}

function drawFx() {
  S.fx = S.fx.filter(function (f) {
    var age = (now - f.t) / 1000;
    if (f.k === 'dot') {
      if (age > 0.7) return false;
      cx.globalAlpha = 1 - age / 0.7; cx.fillStyle = f.c;
      cx.beginPath(); cx.arc(f.x + f.vx * age, f.y + f.vy * age + 9 * T * age * age, f.r, 0, Math.PI * 2); cx.fill();
    } else {
      if (age > 0.9) return false;
      cx.globalAlpha = 1 - age / 0.9; cx.fillStyle = f.c; cx.font = '800 ' + Math.round(T * 0.34) + 'px ' + FONT;
      cx.textAlign = 'center'; cx.lineWidth = 4; cx.strokeStyle = 'rgba(0,0,0,0.7)';
      cx.strokeText(f.s, f.x, f.y - T * 0.7 * age - T * 0.3); cx.fillText(f.s, f.x, f.y - T * 0.7 * age - T * 0.3);
    }
    cx.globalAlpha = 1; return true;
  });
}

function drawHud() {
  // 위: 이동·밀기 수
  if (phase === 'play' || phase === 'demo') {
    var label = TXT.moves + ' ' + S.moves + '   ' + TXT.pushes + ' ' + S.pushes;
    cx.font = '800 ' + Math.round(Math.max(16, Math.min(T * 0.3, 20))) + 'px ' + FONT;
    var w = cx.measureText(label).width + 30, x = (W - w) / 2, y = Math.max(16, H * 0.03);
    cx.fillStyle = 'rgba(20,24,40,0.85)'; rr(x, y, w, 38, 19); cx.fill();
    cx.fillStyle = '#fff'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(label, W / 2, y + 20);
  }
  // 상단 작은 설치 버튼(항상)
  var g = getRect();
  cx.fillStyle = '#ffbf00'; rr(g.x, g.y, g.w, g.h, 15); cx.fill();
  cx.fillStyle = '#1a1300'; cx.font = '800 15px ' + FONT; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(TXT.get, g.x + g.w / 2, g.y + g.h / 2 + 1);
  // 아래: 노란 공격 버튼(오른쪽) + 왼쪽에 목표 문구(노랑) · 조작 안내(작게)
  if (phase === 'play' && !endCard) {
    var b = btnRect(), pulse = 1 + Math.sin(now / 300) * 0.03;
    if (IMG.btn_a && IMG.btn_a.width) cx.drawImage(IMG.btn_a, b.x + b.w * (1 - pulse) / 2, b.y + b.h * (1 - pulse) / 2, b.w * pulse, b.h * pulse);
    var gx = b.x - 14, gw = gx - 16;
    var fit = function (text, size, weight) {
      cx.font = weight + ' ' + size + 'px ' + FONT;
      var mw = cx.measureText(text).width; if (mw > gw) { size = Math.floor(size * gw / mw); cx.font = weight + ' ' + size + 'px ' + FONT; }
    };
    // 두 줄 간격은 글씨 크기 기준(넓은 화면에서 글씨가 커지면 고정 간격이 겹쳤다 — 2026-10-17 사용자 지적), 크기 상한 22/15
    cx.textAlign = 'right'; cx.textBaseline = 'middle';
    var s1 = Math.round(Math.min(22, Math.max(15, T * 0.28))), s2 = Math.round(Math.min(15, Math.max(12, T * 0.21)));
    var mid = b.y + b.h / 2, gap = (s1 + s2) * 0.62;
    fit(TXT.goal, s1, 800);
    cx.fillStyle = '#ffd166'; cx.fillText(TXT.goal, gx, mid - gap / 2);
    fit(TXT.swipe, s2, 600);
    cx.fillStyle = 'rgba(255,255,255,0.8)'; cx.fillText(TXT.swipe, gx, mid + gap / 2);
  }
}

function drawBanner() {
  if (!banner) return;
  var age = now - banner.t; if (age > banner.ms) { banner = null; return; }
  var k = ease(age / 220), fade = age > banner.ms - 250 ? (banner.ms - age) / 250 : 1;
  cx.globalAlpha = fade;
  cx.fillStyle = 'rgba(0,0,0,0.55)'; cx.fillRect(0, H * 0.38, W, H * 0.14);
  var fs = Math.min(W * 0.1, 46);
  cx.font = '900 ' + fs + 'px ' + FONT;
  var tw = cx.measureText(banner.text).width; if (tw > W * 0.9) fs *= W * 0.9 / tw;   // 화면 폭에 맞춰 줄인다
  cx.font = '900 ' + Math.round(fs * (0.6 + 0.4 * k)) + 'px ' + FONT;
  cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.lineWidth = 6; cx.strokeStyle = 'rgba(0,0,0,0.8)';
  cx.strokeText(banner.text, W / 2, H * 0.45); cx.fillStyle = banner.color; cx.fillText(banner.text, W / 2, H * 0.45);
  cx.globalAlpha = 1;
}

function drawEnd() {
  if (!endCard) return;
  var k = ease((now - endCard.t) / 400);
  cx.fillStyle = 'rgba(4,4,10,' + (0.88 * k) + ')'; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = k;
  var s = Math.min(W * 0.32, 140), ix = (W - s) / 2, iy = H * 0.16;
  if (IMG.icon && IMG.icon.width) { cx.save(); rr(ix, iy, s, s, s * 0.22); cx.clip(); cx.drawImage(IMG.icon, ix, iy, s, s); cx.restore(); }
  cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillStyle = '#fff';
  cx.font = '900 ' + Math.round(Math.min(W * 0.09, 40)) + 'px ' + FONT; cx.fillText('Sector31', W / 2, iy + s + 36);
  cx.fillStyle = endCard.win ? '#ffd166' : '#ff9b9b'; cx.font = '800 ' + Math.round(Math.min(W * 0.06, 24)) + 'px ' + FONT;
  cx.fillText(endCard.win ? TXT.clear : (endCard.broke ? TXT.broke : TXT.fail), W / 2, iy + s + 78);
  // 클리어 화면의 「밀기 N번 · 만점 4번」 줄은 뺐다(2026-10-17 사용자 "무슨 말인지 모르겠네")
  cx.fillStyle = 'rgba(255,255,255,0.75)'; cx.font = '600 ' + Math.round(Math.min(W * 0.045, 18)) + 'px ' + FONT;
  cx.fillText(TXT.tag, W / 2, iy + s + 110);
  var b = endButtons(), pulse = 1 + Math.sin(now / 220) * 0.035, bi = b.install;
  cx.save(); cx.translate(bi.x + bi.w / 2, bi.y + bi.h / 2); cx.scale(pulse, pulse);
  cx.fillStyle = '#ffbf00'; rr(-bi.w / 2, -bi.h / 2, bi.w, bi.h, bi.h / 2); cx.fill();
  cx.fillStyle = '#1a1300'; cx.font = '900 ' + Math.round(Math.min(W * 0.06, 24)) + 'px ' + FONT; cx.fillText(TXT.install, 0, 1);
  cx.restore();
  var br = b.retry;
  cx.strokeStyle = 'rgba(255,255,255,0.6)'; cx.lineWidth = 2; rr(br.x, br.y, br.w, br.h, br.h / 2); cx.stroke();
  cx.fillStyle = '#fff'; cx.font = '700 17px ' + FONT; cx.fillText(TXT.retry, W / 2, br.y + br.h / 2 + 1);
  cx.globalAlpha = 1;
}

// ── 자동 실패 장면 ───────────────────────────────────────────────
function runDemo() {
  if (phase !== 'demo' || S.anim || now < demoNext) return;
  var d = DEMOS[demoRun];
  if (demoIdx === 0 && !S.demoLabel) { S.demoLabel = true; showBanner(TXT.tryN.replace('%d', demoRun + 1), 900, '#ffffff'); demoNext = now + 1100; return; }
  if (demoIdx < d.seq.length) {
    var a = d.seq[demoIdx++];
    if (a === 'attack') doAttack(); else doMove(a);
    demoNext = now + DEMO_STEP_MS;
    return;
  }
  if (demoIdx === d.seq.length) {
    demoIdx++;
    showBanner(d.end === 'broke' ? TXT.brokeNow : TXT.stuck, 1700, '#ff6b6b');
    demoNext = now + 2000;
    return;
  }
  if (++demoRun < DEMOS.length) { reset(); demoIdx = 0; demoNext = now + 300; return; }
  phase = 'challenge';
  reset();
  showBanner(TXT.challenge, 1900, '#ffffff');
  setTimeout(function () { if (phase === 'challenge') startPlay(); }, 1950);
}

// ── 루프 ───────────────────────────────────────────────────────
function frame(ts) {
  now = ts;
  if (S.anim && now - S.anim.t >= S.anim.ms) { S.anim = null; if (hint) hint.stale = true; }
  runDemo();
  if (phase === 'play' && !endCard && now - lastInput > 45000) endCard = { t: now, win: false };   // 오래 손 안 대면 마지막 화면
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx.fillStyle = '#05050c'; cx.fillRect(0, 0, W, H);
  var sh = now - S.shake < 160 ? (Math.random() - 0.5) * T * 0.08 : 0;
  cx.save(); cx.translate(sh, sh * 0.5);
  drawBoard();
  // 돌 + 플레이어를 행 순서로(아래 행이 앞)
  var a = S.anim, items = [];
  S.rocks.forEach(function (r) {
    var x = r.x, y = r.y;
    if (a && a.rock && a.rock.r === r && a.kind === 'walk') { var k = ease((now - a.t) / a.ms); x = a.rock.fx + (r.x - a.rock.fx) * k; y = a.rock.fy + (r.y - a.rock.fy) * k; }
    items.push({ y: y, f: function () { var c = T_(x, y); drawRock(r, c.x, c.y); } });
  });
  var pp = playerScreen();
  items.push({ y: (pp.y - OY) / T - 0.5 + 0.01, f: drawPlayer });
  items.sort(function (p, q) { return p.y - q.y; }).forEach(function (it) { it.f(); });
  drawLight();
  drawFx();
  cx.restore();
  // 다음 한 수 힌트(동그라미)는 그리지 않는다 — 2026-10-17 사용자 "가이드는 필요없을 거 같은데"
  drawHud();
  drawBanner();
  drawEnd();
  requestAnimationFrame(frame);
}

function boot() {
  resize();
  reset();
  var go = function () { t0 = performance.now(); demoNext = t0 + 900; requestAnimationFrame(frame); };
  if (window.S31_WAIT_READY) window.S31_WAIT_READY(go); else go();
}
if (pending === 0) boot();
// 브라우저 확인용(미리보기 빌드만) — 자동 검사가 막힘 판정·정답 길이를 직접 본다
if (window.S31_NET === 'preview') window.__s31 = { state: function () { return S; }, solve: function () { return solve(S); }, phase: function () { return phase; }, demo: function () { return demoRun; } };
})();

</script>
